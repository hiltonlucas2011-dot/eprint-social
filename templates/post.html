<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Post Eprintonline</title>
<style>
  @font-face { font-family: 'Figtree'; font-weight: 600; src: url('../brand/fonts/Figtree-SemiBold.ttf'); }
  @font-face { font-family: 'Figtree'; font-weight: 700; src: url('../brand/fonts/Figtree-Bold.ttf'); }
  @font-face { font-family: 'Figtree'; font-weight: 800; src: url('../brand/fonts/Figtree-ExtraBold.ttf'); }
  @font-face { font-family: 'Maven Pro'; font-weight: 400; src: url('../brand/fonts/MavenPro-Regular.ttf'); }
  @font-face { font-family: 'Maven Pro'; font-weight: 500; src: url('../brand/fonts/MavenPro-Medium.ttf'); }
  @font-face { font-family: 'Maven Pro'; font-weight: 700; src: url('../brand/fonts/MavenPro-Bold.ttf'); }

  :root {
    --green: #6AB04C; --green-dark: #4A8A2E; --green-light: #F0F9EB;
    --navy: #222831; --text: #2C3E50; --gray: #6B7280; --white: #FFFFFF;
    --offwhite: #F6F7E9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { font-family: 'Maven Pro', sans-serif; }

  .post { position: relative; width: 1080px; height: 1350px; padding: 96px 88px 0; overflow: hidden;
          display: flex; flex-direction: column; }
  .deco { position: absolute; border-radius: 50%; pointer-events: none; }

  /* Temas */
  .verde   { background: var(--green); color: var(--white); }
  .marinho { background: var(--navy);  color: var(--white); }
  .claro   { background: var(--offwhite); color: var(--navy); }
  .verde .deco   { background: rgba(255,255,255,.10); }
  .marinho .deco { background: rgba(106,176,76,.16); }
  .claro .deco   { background: rgba(106,176,76,.12); }

  .tag { display: inline-flex; align-items: center; gap: 18px; font-family: 'Figtree'; font-weight: 700;
         font-size: 28px; letter-spacing: .18em; text-transform: uppercase; margin-bottom: 44px; position: relative; }
  .tag::before { content: ''; width: 56px; height: 6px; border-radius: 3px; background: currentColor; }
  .marinho .tag::before, .claro .tag::before { background: var(--green); }
  .claro .tag { color: var(--green-dark); }

  h1 { font-family: 'Figtree'; font-weight: 800; font-size: 104px; line-height: 1.02; letter-spacing: -.02em;
       position: relative; text-wrap: balance; }
  h1.m { font-size: 88px; } h1.s { font-size: 74px; }
  h1 em { font-style: normal; }
  .verde h1 em   { color: var(--navy); }
  .marinho h1 em { color: var(--green); }
  .claro h1 em   { color: var(--green); }

  .sub { font-size: 38px; line-height: 1.38; margin-top: 40px; max-width: 860px; position: relative; font-weight: 500; }
  .claro .sub { color: var(--text); }
  .verde .sub, .marinho .sub { color: rgba(255,255,255,.92); }

  ul { list-style: none; margin-top: 52px; display: flex; flex-direction: column; gap: 22px; position: relative; }
  li { display: flex; align-items: flex-start; gap: 22px; font-size: 34px; line-height: 1.3; font-weight: 500; }
  li .ck { flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; margin-top: -2px; }
  .verde li .ck   { background: var(--white); }
  .marinho li .ck, .claro li .ck { background: var(--green); }
  li .ck svg { width: 26px; height: 26px; }
  .claro li { color: var(--text); }

  .num { font-family: 'Figtree'; font-weight: 800; font-size: 220px; line-height: .9; position: relative; margin-top: 30px; }
  .verde .num { color: var(--white); } .marinho .num, .claro .num { color: var(--green); }
  .num small { font-size: 40px; font-weight: 700; letter-spacing: .02em; display: block; margin-top: 18px; }
  .marinho .num small, .verde .num small { color: var(--white); } .claro .num small { color: var(--navy); }


  /* Variante com foto do produto: foto no topo, texto embaixo */
  .post.com-foto { padding-top: 0; }
  .foto { margin: 0 -88px 56px; height: 680px; position: relative; overflow: hidden; flex: none; background: #fff; }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .foto.contain { display: flex; justify-content: center; align-items: center; }
  .foto.contain img { width: auto; max-width: 100%; height: calc(100% - 48px); object-fit: contain;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 9%, #000 91%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 9%, #000 91%, transparent); }
  .foto::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: var(--green); }
  .verde .foto::after { background: var(--navy); }
  .com-foto .tag { margin-bottom: 26px; font-size: 24px; }
  .com-foto h1 { font-size: 72px; } .com-foto h1.m { font-size: 64px; } .com-foto h1.s { font-size: 56px; }
  .com-foto .sub { font-size: 32px; margin-top: 24px; }
  .com-foto .cta { margin-bottom: 44px; font-size: 30px; padding: 22px 44px; }
  .com-foto footer { padding: 32px 88px; }
  .com-foto .deco { display: none; }
  .spacer { flex: 1; } .spacer.top { flex: .55; }

  .cta { align-self: flex-start; font-family: 'Figtree'; font-weight: 700; font-size: 34px; padding: 26px 52px;
         border-radius: 999px; position: relative; margin-bottom: 64px; }
  .verde .cta   { background: var(--white); color: var(--green-dark); }
  .marinho .cta, .claro .cta { background: var(--green); color: var(--white); }

  footer { margin: 0 -88px; padding: 40px 88px; display: flex; align-items: center; justify-content: space-between;
           position: relative; }
  .verde footer   { border-top: 2px solid rgba(255,255,255,.28); }
  .marinho footer { border-top: 4px solid var(--green); }
  .claro footer   { background: var(--navy); }
  footer img { height: 62px; display: block; }
  footer .site { font-family: 'Figtree'; font-weight: 600; font-size: 28px; letter-spacing: .04em; color: var(--white); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="STROKE"/></svg>';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  // *texto* vira destaque de cor no título
  const accent = s => esc(s).replace(/\*(.+?)\*/g, '<em>$1</em>');

  window.renderPost = function (p) {
    const layout = ['verde', 'marinho', 'claro'].includes(p.layout) ? p.layout : 'verde';
    const plain = String(p.titulo || '').replace(/\*/g, '');
    const size = plain.length > 48 ? 's' : plain.length > 30 ? 'm' : '';
    const stroke = layout === 'verde' ? '#4A8A2E' : '#FFFFFF';
    const logo = '../brand/logos/logo-horizontal-invertido.svg';
    const bullets = (p.bullets || []).slice(0, p.foto_url ? 0 : 4).map(b =>
      `<li><span class="ck">${CHECK.replace('STROKE', stroke)}</span><span>${esc(b)}</span></li>`).join('');
    const destaque = p.destaque ? `<div class="num">${esc(p.destaque.valor)}<small>${esc(p.destaque.legenda)}</small></div>` : '';
    const foto = p.foto_url ? `<div class="foto${p.foto_ajuste === 'contain' ? ' contain' : ''}"${/^#[0-9a-fA-F]{6}$/.test(p.foto_fundo || '') ? ` style="background:${p.foto_fundo}"` : ''}><img src="${esc(p.foto_url)}" alt=""></div>` : '';
    document.getElementById('root').innerHTML = `
      <div class="post ${layout}${foto ? ' com-foto' : ''}">
        <span class="deco" style="width:620px;height:620px;right:-220px;top:-180px"></span>
        <span class="deco" style="width:300px;height:300px;right:120px;top:300px"></span>
        <span class="deco" style="width:460px;height:460px;left:-200px;bottom:120px"></span>
        ${foto || '<div class="spacer top"></div>'}
        ${p.tag ? `<div class="tag">${esc(p.tag)}</div>` : ''}
        <h1 class="${size}">${accent(p.titulo)}</h1>
        ${p.subtitulo ? `<p class="sub">${esc(p.subtitulo)}</p>` : ''}
        ${destaque}
        ${bullets ? `<ul>${bullets}</ul>` : ''}
        <div class="spacer"></div>
        ${p.cta ? `<div class="cta">${esc(p.cta)}</div>` : ''}
        <footer><img src="${logo}" alt="eprintonline"><span class="site">www.eprintonline.com.br</span></footer>
      </div>`;
    return document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; }))));
  };
</script>
</body>
</html>
